<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { text-align:center; padding:24px; }
  .code { font-size:5rem; font-weight:800; background:linear-gradient(90deg,#58a6ff,#a371f7); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:var(--dim); margin:12px 0 28px; font-size:1.05rem; }
  a.btn { display:inline-block; background:var(--card); color:var(--accent); border:1px solid var(--border); border-radius:8px; padding:10px 22px; text-decoration:none; font-size:.9rem; transition:border-color .15s; }
  a.btn:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <p>This page doesn't exist — but the projects do.</p>

</div>
</body>
