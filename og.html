<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; font-family:'Segoe UI',system-ui,sans-serif; height:100vh; overflow:hidden;
         display:flex; align-items:center; justify-content:center; position:relative; }
  .glow { position:absolute; border-radius:50%; filter:blur(120px); opacity:.25; }
  .g1 { width:500px; height:500px; background:#58a6ff; top:-200px; left:-150px; }
  .g2 { width:450px; height:450px; background:#a371f7; bottom:-180px; right:-120px; }
  .card { position:relative; z-index:1; text-align:center; }
  .mark { font-family:Consolas,monospace; font-size:15px; letter-spacing:4px; color:#8b949e; text-transform:uppercase; margin-bottom:14px; }
  h1 { font-size:74px; font-weight:800; color:#e6edf3; letter-spacing:-1px; }
  h1 span { background:linear-gradient(90deg,#58a6ff,#a371f7); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:#8b949e; font-size:24px; margin-top:16px; }
  .tags { margin-top:34px; display:flex; gap:12px; justify-content:center; }
  .t { font-size:15px; color:#58a6ff; border:1px solid #30363d; border-radius:20px; padding:6px 18px; background:#161b22; }
</style></head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="card">
    <div class="mark">// atsdopi.github.io</div>
    <h1>ATSDopi <span>Open Source</span></h1>
    <div class="sub">OSINT &amp; security tools · dev utilities · self-hosted apps</div>
    <div class="tags"><span class="t">18 projects</span><span class="t">Python · Rust · TS</span><span class="t">github.com/ATSDopi</span></div>
  </div>
</body></html>
